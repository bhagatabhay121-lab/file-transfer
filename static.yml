<h1>Privacy Policy</h1>
<p class="muted"><strong>Free Invoice Generator</strong> (also shown inside the app as "Invoice Studio"; package name: com.abhay.invoice)<br>
Effective date: 6 October 2026 &middot; Last updated: 6 October 2026</p>

<p>Free Invoice Generator ("the app", "we", "us") helps you create GST invoices and related documents (such as quotations, challans, proforma invoices and credit notes), keep a list of customers and products, export PDFs and GST reports, and email invoices and statements to your customers. This policy explains what information the app handles, where it goes, and the choices you have. We have tried to keep it short and honest.</p>

<h2>1. The short version</h2>
<ul>
  <li>Your invoices, customers, products and business profile are saved <strong>on your phone</strong>, and <strong>a copy is also backed up to our cloud database (Google Firebase)</strong> once you have entered your name and accepted the Terms &amp; conditions. We can see this backed-up data.</li>
  <li>We also collect usage information: your name, when you open the app, how long you use it, and a summary of your business and of the documents you create.</li>
  <li>If you send us feedback from Settings, it is stored in the same database together with your name and the contact you choose to give.</li>
  <li>When you email an invoice or statement, the email address, message and PDF are sent through our email service.</li>
  <li>When you look up a GSTIN, the GSTIN and the CAPTCHA you type are sent to a GST portal search service to fetch the business's public details.</li>
  <li><strong>You can ask us to delete your data at any time</strong> (see section 12).</li>
  <li>We do not show ads, do not sell your data and do not share it for marketing.</li>
</ul>

<h2>2. Information stored on your device</h2>
<p>The following is created by you and saved in the app's private storage on your phone:</p>
<ul>
  <li>Your business profile: business name, address, GSTIN, PAN, MSME number, phone, email, bank details, UPI ID, terms text, logo, signature and watermark</li>
  <li>Customers (including their phone numbers and email addresses), products and the invoices and other documents you create, including numbers, items, amounts, payments, status and notes</li>
  <li>App settings such as language, theme, default GST rate, Do Not Disturb preference and the sender name used for emails</li>
</ul>
<p>If you uninstall the app, clear its data or lose your phone, the copy on your phone is erased. The cloud backup described in section 3 stays with us until you ask us to delete it (section 12).</p>

<h2>3. Cloud backup of your data</h2>
<p>After you enter your name and accept the Terms &amp; conditions, the app automatically backs up your data to our Firebase Realtime Database. The backup is stored under a random install ID (see section 4) and includes:</p>
<ul>
  <li>Your business profile, including name, address, GSTIN, PAN, MSME number, phone, email, bank details, UPI ID, terms text, logo, signature and watermark image</li>
  <li>Your product list</li>
  <li>Your customers, including their names, addresses, GSTIN, phone numbers and email addresses</li>
  <li>Every invoice and other document you create, with its items, amounts, payments, status and notes, and the next document numbers</li>
</ul>
<p>The app uploads only what changed, shortly after you make a change, when you leave the app, and it retries automatically if you were offline. When you delete a customer, product or document on your phone, its cloud copy is removed at the next backup. We use the backup to keep your data safe, to give you support when something goes wrong, and to understand and improve the app. It is not shown to other users of the app, and access to it is limited to the app's administrator.</p>
<p><strong>Your customers' information:</strong> the names, phone numbers, email addresses and other details of your customers are information you enter yourself. By using the app you confirm that you are entitled to store and use that information, and you are responsible for complying with the laws that apply to it.</p>

<h2>4. Usage information we collect</h2>
<p>From the time you enter your name, the app sends the following to our Firebase Realtime Database:</p>
<div class="table-wrap">
<table>
  <tr><th>Information</th><th>Why we collect it</th></tr>
  <tr><td>The name you enter</td><td>To tell users apart when we review usage, give support and answer feedback or deletion requests</td></tr>
  <tr><td>A random install ID generated by the app (it is not your device advertising ID, phone number or email)</td><td>To count how many people use the app without counting the same person twice, and to keep your backup separate from everyone else's</td></tr>
  <tr><td>Install date, last-seen time, number of visits and total time the app was open, per day and in total</td><td>To measure daily and total users and how much the app is used</td></tr>
  <tr><td>App version, phone platform (for example Android) and selected app language</td><td>To fix problems that affect particular versions or languages</td></tr>
  <tr><td>A business summary: business name, GSTIN, city, state, phone and email from your profile, and counts of your documents, drafts, customers and products, the total amount billed and received, and the time of your last backup</td><td>To show the administrator a list of users without opening every invoice, and to support you</td></tr>
  <tr><td>For each invoice or document you create or update: the date and time, whether it was created or updated, its type and number, and your UPI ID</td><td>To understand how the app is used</td></tr>
</table>
</div>
<p>We do <strong>not</strong> collect your location, your contacts list or your advertising ID.</p>

<h2>5. Feedback you send</h2>
<p>In Settings you can choose "Send feedback". The feedback you send is stored in our Firebase Realtime Database and includes: the type you pick (suggestion, problem, compliment or other), an optional star rating, your message, an optional phone number or email if you want a reply, your name, your install ID, the app version, your phone platform and app language, and the time. We use it only to improve the app and to reply to you. If you are offline, your feedback is kept on your phone and sent the next time the app opens. You can ask us to delete it at any time (section 12).</p>

<h2>6. Messages and updates from us</h2>
<p>The app checks our database when it opens, when you return to it, and about once a minute while it is open, to see whether a new version is available, whether the app is in maintenance, and whether there are messages for you (for example announcements or update notices). The administrator can also block an install from using the app. When a message is delivered to you or you open it, the app records the time together with your name and install ID, so we can tell whether the message reached you. Messages may contain a link; it opens in your phone's browser only when you tap it.</p>

<h2>7. Sending invoices and statements by email</h2>
<p>When you choose "Email PDF" or "Email statement", the app builds the PDF on your phone and sends the following to our email gateway, which hands it to our email delivery provider (Maileroo) to deliver:</p>
<ul>
  <li>The recipient email address(es) you enter or that are saved for the customer</li>
  <li>The subject and message text</li>
  <li>The PDF attachment. Depending on what you put in the document, it can include your business details (name, address, GSTIN, bank details, UPI ID, logo, signature), your customer's details, line items and amounts</li>
  <li>Your business name or sender name (shown as the sender) and your profile email address, if you have saved one (set as the Reply-To address so that replies reach you)</li>
</ul>
<p>The email is sent from an address belonging to our email service, not from your own mailbox, and the recipient can see it. We do not keep a copy of the emails or PDFs in our own database. The gateway and the delivery provider process them in order to deliver them and may keep delivery logs under their own policies. This happens only when you choose to send an email. By using this feature you confirm that you are entitled to contact those customers and you are responsible for complying with the laws that apply to your messages.</p>

<h2>8. GSTIN lookup</h2>
<p>If you type a GSTIN when adding a customer, the app can fetch that business's public registration details (such as trade name, address and status). To do this, the app first requests a CAPTCHA image, and then the <strong>GSTIN and the CAPTCHA text you type</strong> are sent over the internet to a third-party GST portal search service (ExpressGST). Like any internet request, this also reveals your IP address to that service. The details returned are put into the customer form on your phone. This lookup only happens when you enter a GSTIN and choose to complete the CAPTCHA, and you can skip it and fill in the details manually. That service has its own privacy practices, which we do not control.</p>

<h2>9. Permissions the app may ask for</h2>
<ul>
  <li><strong>Photos / files / camera:</strong> only when you choose to add a logo, signature or watermark image, either from your gallery or by taking a photo. The image is stored on your phone inside the app and is included in your cloud backup (section 3). If you add it to an invoice and then email it, the image is part of the PDF that is sent.</li>
  <li><strong>Do Not Disturb access (optional):</strong> only if you turn on the "Do Not Disturb while the app is open" setting. It is used to switch Do Not Disturb on while the app is open and off when you leave. Nothing about this is sent to us.</li>
  <li><strong>Internet:</strong> to back up your data and send usage information (sections 3 and 4), to send feedback (section 5), to check for updates and messages (section 6), to send emails (section 7) and to do the GSTIN lookup (section 8).</li>
</ul>

<h2>10. Exporting, printing and sharing</h2>
<p>When you export, print or share an invoice, statement or GST report (PDF or Excel file), the file is created on your phone and handed to the app you choose (for example WhatsApp, email or a printer). In the same way, if you use "Backup" in the app to copy your data as text, that text stays on your phone until you paste it somewhere yourself. Once you share something, it is handled by that app and the person you send it to, under their rules. We do not receive a copy.</p>

<h2>11. Who we share information with</h2>
<p>We do not sell or rent your information. We use the following service providers, each only for the purpose described:</p>
<ul>
  <li><strong>Google Firebase</strong> &ndash; stores the cloud backup, usage information, feedback and messages in sections 3 to 6 (<a href="https://firebase.google.com/support/privacy" target="_blank" rel="noopener">Firebase privacy information</a>).</li>
  <li><strong>Supabase</strong> &ndash; hosts the gateway that passes your emails to the delivery provider below.</li>
  <li><strong>Maileroo</strong> &ndash; delivers the emails you send (section 7).</li>
  <li><strong>ExpressGST</strong> &ndash; the third-party GST portal search service used for GSTIN lookup (section 8).</li>
</ul>
<p>We may also disclose information if the law requires it.</p>

<h2>12. Your choices and rights, and deleting your data</h2>
<ul>
  <li><strong>Ask us to delete your data:</strong> you can request deletion at any time. In the app, go to Settings &rarr; Send feedback and write that you want your data deleted, or email us at the address below. Please include the name you entered in the app. We will delete your cloud backup, your usage information and your feedback, and tell you when it is done.</li>
  <li><strong>Access or correction:</strong> email us with the name you entered and we will tell you what we hold about you and correct it where needed. Because the install ID is random and not linked to your phone number or email, we may need your name to find your record.</li>
  <li><strong>Delete data on your phone:</strong> uninstall the app or clear its storage in your phone's Settings. This does <strong>not</strong> delete the cloud copy, so send us a deletion request as above if you want that removed too.</li>
  <li><strong>Stop uploads:</strong> uninstalling the app stops all uploads.</li>
  <li><strong>Emails:</strong> emails are sent only when you choose to send them.</li>
  <li><strong>Customers who received an email:</strong> if you are a customer who received an email from a business using this app, please contact that business. You can also write to us and we will help where we can.</li>
</ul>

<h2>13. How long we keep information</h2>
<p>Information on your phone stays until you delete it, clear the app's data or uninstall the app. The cloud backup, usage information and feedback in our database are kept while the app is in use and for as long as we need them to support you and to understand and improve the app, or until you ask us to delete them. We do not store the content of emails in our own database; the providers listed in section 11 keep delivery records for the periods set by their own policies.</p>

<h2>14. Security</h2>
<p>Information sent to Firebase, to our email gateway and to the GST service travels over encrypted (HTTPS) connections. Cloud data is stored under a random install ID, and reading it requires the administrator's sign-in. Data stored on your phone is protected by your phone's own security, such as its screen lock, so we recommend keeping one. Email is not end-to-end encrypted once it leaves the app, so please avoid putting sensitive information in message text. No system is completely secure, so we cannot guarantee absolute security.</p>

<h2>15. Children's privacy</h2>
<p>The app is a business tool and is not directed to children under 13 (or under 18 where the law of your country requires parental consent). We do not knowingly collect information from children. If you believe a child has given us a name, please contact us and we will delete it.</p>

<h2>16. Changes to this policy</h2>
<p>We may update this policy from time to time. When we do, we will change the "Last updated" date above and, for significant changes, show a notice in the app and ask you to accept the updated Terms &amp; conditions again. Continuing to use the app after a change means you accept the updated policy.</p>

